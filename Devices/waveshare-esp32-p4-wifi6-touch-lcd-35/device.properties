general.vendor=Waveshare
general.name=ESP32-P4-WIFI6-Touch-LCD-3.5
general.incubating=true

apps.launcherAppId=tactility.launcher

hardware.target=ESP32P4
hardware.flashSize=16MB
hardware.spiRam=true
hardware.spiRamMode=HEX
hardware.spiRamSpeed=200M
hardware.esptoolFlashFreq=80M
hardware.usbHostEnabled=true
hardware.bluetooth=true

dependencies.useDeprecatedHal=false

# Enable the built-in TouchCalibration app and include it in the first-boot Setup wizard
touch.calibrationSupported=true
touch.calibrationRequired=true

storage.userDataLocation=SD

display.size=3.5"
display.shape=rectangle
display.dpi=165

lvgl.colorDepth=16

sdkconfig.CONFIG_WIFI_PROV_SCAN_MAX_ENTRIES=16
sdkconfig.CONFIG_WIFI_PROV_AUTOSTOP_TIMEOUT=30
sdkconfig.CONFIG_WIFI_PROV_STA_ALL_CHANNEL_SCAN=y
sdkconfig.CONFIG_ESP_HOSTED_ENABLED=y
sdkconfig.CONFIG_ESP_HOSTED_P4_DEV_BOARD_FUNC_BOARD=y
sdkconfig.CONFIG_ESP_HOSTED_SDIO_HOST_INTERFACE=y
sdkconfig.CONFIG_SLAVE_IDF_TARGET_ESP32C6=y
sdkconfig.CONFIG_ESP_HOSTED_USE_MEMPOOL=n

# ESP32-P4 rev <v3 runs at its full 360 MHz
sdkconfig.CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240=n
sdkconfig.CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_360=y
sdkconfig.CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ=360
sdkconfig.CONFIG_ESP32P4_DEFAULT_CPU_FREQ_240=n
sdkconfig.CONFIG_ESP32P4_DEFAULT_CPU_FREQ_360=y
sdkconfig.CONFIG_ESP32P4_DEFAULT_CPU_FREQ_MHZ=360
# Larger L2 cache reduces PSRAM stalls for draw buffers
sdkconfig.CONFIG_CACHE_L2_CACHE_256KB=y
# Cache-line-aligned LVGL draw buffers (P4 L2 line = 64B)
sdkconfig.CONFIG_LV_DRAW_BUF_ALIGN=64
# One full 320x480 RGB565 frame takes ~30ms at 80MHz SPI; a faster LVGL refresh period
# starves the ST7796 transaction queue and leaves part-drawn screens. Retune only with
# hardware/display validation.
sdkconfig.CONFIG_LV_USE_SNAPSHOT=y
sdkconfig.CONFIG_SPIRAM_USE_MALLOC=y

# USB audio: 16 ms of isochronous transfers tolerates short display/decoder
# scheduling bursts better than the component's 9 ms default.
sdkconfig.CONFIG_UAC_NUM_ISOC_URBS=4
sdkconfig.CONFIG_UAC_NUM_PACKETS_PER_URB=4
